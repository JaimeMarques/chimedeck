services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chimedeck_lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?}
      POSTGRES_DB: chimedeck_lab
    ports: ['127.0.0.1:35432:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chimedeck_lab -d chimedeck_lab']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:36379:6379']
    volumes: [redis:/data]
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports: ['127.0.0.1:34566:4566']
    volumes: [s3:/var/lib/localstack]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4566/_localstack/health']
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    image: oven/bun:1.3.14
    working_dir: /app
    command: ['bun', 'server/index.ts']
    labels:
      org.chimedeck.lab.marker: ${LAB_MARKER:?}
    ports: ['127.0.0.1:33000:3000']
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          'process.exit((await fetch("http://127.0.0.1:3000/health")).ok ? 0 : 1)',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: ['${LAB_CHECKOUT:?}:/app:ro']
    environment:
      NODE_ENV: development
      APP_PORT: '3000'
      APP_URL: http://127.0.0.1:35173
      VITE_APP_URL: http://127.0.0.1:35173
      APP_BASE_URL: http://127.0.0.1:35173
      DATABASE_URL: postgresql://chimedeck_lab:${LAB_DB_PASSWORD:?}@postgres:5432/chimedeck_lab
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY: ${LAB_JWT_PRIVATE_KEY:?}
      JWT_PUBLIC_KEY: ${LAB_JWT_PUBLIC_KEY:?}
      FLAG_USE_REDIS: 'true'
      FLAG_USE_LOCAL_STORAGE: 'true'
      S3_ENDPOINT: http://127.0.0.1:34566
      S3_INTERNAL_ENDPOINT: http://localstack:4566
      S3_BUCKET: chimedeck-lab
      S3_REGION: us-east-1
      S3_AWS_ACCESS_KEY_ID: test
      S3_AWS_SECRET_ACCESS_KEY: test
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      FLAG_SES_ENABLED: 'false'
      FLAG_EMAIL_VERIFICATION_ENABLED: 'false'
      EMAIL_NOTIFICATIONS_ENABLED: 'false'
      ADMIN_INVITE_EMAIL_ENABLED: 'false'
      EMAIL_DOMAIN_RESTRICTION_ENABLED: 'false'
      CHAT_EMBEDDING_ENABLED: 'false'
      AGENTIC_WORKFLOW_ENABLED: 'false'
      WEBHOOKS_ENABLED: 'false'
      GITHUB_WEBHOOKS_ENABLED: 'false'
      SUBSCRIPTIONS_ENABLED: 'false'
      OTEL_ENABLED: 'false'
      SENTRY_SERVER_ENABLED: 'false'
      SEARCH_ENABLED: 'true'
      FEATURE_FLAGS_PROVIDER: local
networks:
  default: {}
volumes:
  postgres:
  redis:
  s3:
