name: MCP discussion reads

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcp-discussion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discussion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      # Job and workflow names are kept so existing required checks still match.
      - name: Test MCP tool registration, discussion and board coverage contracts
        run: bun test server/extensions/mcp
      - name: Lint MCP discussion and board coverage implementation and fixtures
        run: >-
          bunx --no-install eslint
          server/extensions/mcp/tools/readDiscussion.ts
          server/extensions/mcp/tools/readDiscussion.test.ts
          server/extensions/mcp/tools/readDiscussion.fixture.ts
          server/extensions/mcp/tools/toolSupport.ts
          server/extensions/mcp/tools/toolSupport.fixture.ts
          server/extensions/mcp/tools/toolSupport.test.ts
          server/extensions/mcp/tools/boardLookups.ts
          server/extensions/mcp/tools/boardLookups.test.ts
          server/extensions/mcp/tools/cardEdits.ts
          server/extensions/mcp/tools/cardEdits.test.ts
          server/extensions/mcp/tools/comments.ts
          server/extensions/mcp/tools/comments.test.ts
          server/extensions/mcp/tools/attachments.ts
          server/extensions/mcp/tools/attachments.test.ts
          server/extensions/mcp/tools/labels.ts
          server/extensions/mcp/tools/labels.test.ts
          server/extensions/mcp/tools/members.ts
          server/extensions/mcp/tools/members.test.ts
          server/extensions/mcp/tools/checklists.ts
          server/extensions/mcp/tools/checklists.test.ts
          server/extensions/mcp/tools/listBoardAdmin.ts
          server/extensions/mcp/tools/listBoardAdmin.test.ts
          server/extensions/mcp/registerTools.ts
          server/extensions/mcp/registerTools.test.ts
      - name: Build client including MCP developer documentation
        run: bun run build:client
