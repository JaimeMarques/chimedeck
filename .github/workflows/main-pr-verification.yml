name: Main PR verification

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify npm lockfile installability
        run: npm ci --dry-run --ignore-scripts --no-audit --no-fund --silent

      - name: Build client
        run: bun run build:client

      - name: Check pull-request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check merged-main diff
        if: github.event_name == 'push'
        # Fixed refs only; no user-provided event text is interpolated into the shell.
        run: git diff --check HEAD^ HEAD
