name: Historical Import CI

on:
  push:
  pull_request:

jobs:
  historical-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test tests/integration/historicalImport tests/unit/server/extensions/historicalImport
